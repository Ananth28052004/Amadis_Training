<head>
    <meta charset="UTF-8">

             position: absolute;

            top:150px;

        }
        .div3{
            background-color:yellow;
             position: absolute;
            left: 200px;
            top:200px;

        }
    </style>
    <div class="div1"></div>
    <div class="div2"></div>
    <div class="div3"></div>
    <div class="div3"></div>
</body>
</html>
