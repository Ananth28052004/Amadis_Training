<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Element</title>
    <link rel="stylesheet" href="SelectingElement.css">
</head>
<body>
    <h1 class="head">Selecting Element</h1><br>
    <hr>
    <div class="usingid">
        <h3>Select id</h3>
        <label for="">name: </label>
        <input type="text" name="" id="nameid">
        <button id="clickid">Select id</button><br><br>
        <h2 id="ansid"></h2>
    </div>
    <hr>
    <div class="usingclass">
        <h3>Select Class</h3>
        <label for="">num 1:</label>
        <input type="number" class="num"><br>
        <label for="" >num 2:</label>
        <input type="number" class="num">
        <button class="btnclass">Add</button>
        <br>
        <h2 class="num"></h2>
    </div>
    <hr>
    <div class="usingtagname">
        <h3>Select Tag</h3>
        <h6>Tag-1</h6>
        <h6>Tag-2</h6>
        <h6>Tag-3</h6><br><br>
        <label for="">Change Text number:</label>
        <input type="number" class="tagname">
        <button class="tagname">Click</button>
        <h2 class="tagname"></h2>
    </div><hr>
    <div class="queryselector">
        <h3>queryselector</h3>
        <h5>Vote Age Validation</h5>
        <label for="">Enter Your Age:</label>
        <input type="number" id="age">
        <button class="btnquery">Check</button>
        <h2 id="ansq"></h2>
    </div><hr>
    <div class="queryselectorall">
        <h3>Query Selector All</h3>
        <h1 class="h1tag">One</h1>
        <h1 class="h1tag">Two</h1>
        <h1 class="h1tag">Three</h1>
    </div><hr>
    <script src="SelectingElement.js"></script>
</body>
</html>
