<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="Password.css" />
  </head>
  <body>
    <h2>Password Checker</h2>
    <form action="">
      <h1>Create Account</h1>
      <div class="maindiv">
        <div class="fname">
          <label for="fname" >First Name:</label>
          <input type="text" placeholder="First Name" id="fname" oninput="nameValid('first Name')" />
          <h5 id="fnameop"></h5>
        </div>
        <div class="lname">
          <label for="lname">Last Name:</label>
          <input type="text" placeholder="Last Name" id="lname" oninput="checkLastName()"/>
          <h5 id="lnameop"></h5>
        </div>
        <div class="uname">
          <label for="uname">User Name:</label>
          <input type="text" placeholder="user name" id="uname" oninput="checkUserName()"/>
          <h5 id="unameop"></h5>
        </div>
        <div class="pass">
          <label for="pass">Password:</label>
          <input type="text" placeholder="Password" id="pass" oninput="passwordCheck()"/>
          <h5 id="passop"></h5>
        </div>
        <div class="cpass">
          <label for="cpass">Conform Password:</label>
          <input type="password" placeholder="Conform Password" id="cpass" oninput="passwordEqual()"/>
          <h5 id="cpassop"></h5>
        </div>
        <div class="button">
          <button class="reset">Reset</button>
          <button class="submit">Submit</button>
        </div>
      </div>
    </form>
    <script src="Password.js"></script>
  </body>
</html>
