<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ExampleFlex.css">
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="maindiv">
        <div class="part1">
            <img src="IMG_20250325_153159.jpg" alt="" class="img">
            <div class="part1div">
                <h3>20%</h3>
                <h5><i class="fa-regular fa-heart"></i></h5>
            </div>
        </div>
        <div class="part2">
            <div class="divhead">
                <h3>Classic White Sneakers</h3>
                <h5><i class="fa-regular fa-star"></i></h5>
                <h5>(4.3)</h5>
            </div>
            <div class="divpara">
                <p>Minamalist Snakers Made from aco leather and Soft Lining</p>
            </div>
            <div class="divrs">
                <h3>$30.00</h3>
                <h4><del>$37.88</del></h4>
            </div>
            <h4 style="margin-top: 4px;">Size</h4>
            <div class="divsize">
                <div class="divs1">40</div>
                <div class="divs2">41</div>
                <div class="divs3">42</div>
                <div class="divs4">43</div>
                <div class="divs5">44</div>

            </div>
            <p>In Stock- Only 3 left</p>
            <div class="final">
                <button><i class="fa-solid fa-cart-shopping"></i>    Add To Cast</button>
            </div>
        </div>
        
    </div>
    
</body>
</html>
